<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="utf-8">
    <title>Contact Form</title>
</head>

<body>

    <div class="form-container">

        <form>
            <h2>Some Contact Form</h2>
            <label for="name">Text input field <input type="text" id="name" name="name" required /></label>
            <label for="email">Email input field <input type="email" id="email" name="email" required /></label>
            <label for="textarea">Some text area<textarea id="textarea" name="textarea" required></textarea></label>
            <button type="submit">Submit</button>
        </form>

    </div>

</body>

</html>
