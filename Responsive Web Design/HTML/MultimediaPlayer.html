<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Media Player</h1>

  <section>
    <h2>Song: Sailing Away</h2>
    <audio controls aria-label="song">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mp3" />
    </audio>
  </section>

  <section>
    <h2>Video: What is the map method and how does it work?</h2>
    <video controls width="300" aria-label="video">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" srclang="en" label="transcript" kind="vtt">
    </video>
  </section>

  <section>
    <h2>Transcript</h2>
    <p>This is a transcript placeholder for the video.</p>
  </section>

</body>

</html>
